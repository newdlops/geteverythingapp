worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;
    keepalive_timeout 15;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        absolute_redirect off;
        root /srv/current;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /install { return 302 /install/; }
        location = /install/ { try_files /install/index.html =404; }
        location ~ ^/install/(?:releases/)?[A-Za-z0-9_.-]+\.apk$ {
            types { application/vnd.android.package-archive apk; }
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
        }
        location /install/ {
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
        }
        location / { return 404; }
    }
}
