version: "3.8"

services:
  install:
    image: geteverything-install:20260917-2-ea556c7f-r3
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    networks:
      - traefiknet
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20251213-1303
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefiknet
        traefik.http.routers.geteverything-install.rule: "Host(`158.180.67.53`) && (Path(`/install`) || PathPrefix(`/install/`))"
        traefik.http.routers.geteverything-install.entrypoints: http
        traefik.http.routers.geteverything-install.service: geteverything-install
        traefik.http.services.geteverything-install.loadbalancer.server.port: "8080"
        traefik.http.services.geteverything-install.loadbalancer.healthcheck.path: /healthz
        traefik.http.services.geteverything-install.loadbalancer.healthcheck.interval: 15s

networks:
  traefiknet:
    external: true
